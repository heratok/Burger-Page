name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate:
    name: Lint, Typecheck & Test Monorepo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: burger_page_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d burger_page_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npm run lint

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      # The service container starts before checkout, so bind-mounting
      # ./database/*.sql into docker-entrypoint-initdb.d is racy (a missing
      # host file mounts as a directory and the init scripts are silently
      # skipped). Copy + apply idempotently after checkout instead: the
      # schema creates the app_user role used by the integration tests.
      - name: Apply Postgres schema and seed
        run: |
          docker cp ./database/01_schema.sql "${{ job.services.postgres.id }}":/tmp/01_schema.sql
          docker cp ./database/02_seed.sql "${{ job.services.postgres.id }}":/tmp/02_seed.sql
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d burger_page_test -v ON_ERROR_STOP=1 -1 -f /tmp/01_schema.sql
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d burger_page_test -v ON_ERROR_STOP=1 -f /tmp/02_seed.sql

      - name: Run PostgreSQL integration tests
        run: npm run test:integration:postgres
        env:
          # SKIP_COMPOSE avoids the script's docker compose lifecycle: the
          # service container above is already running and reachable.
          SKIP_COMPOSE: '1'
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/burger_page_test
          APP_USER_DATABASE_URL: postgres://app_user:app_user_test_only@localhost:5432/burger_page_test

      - name: Build production artifacts
        run: npm run build

  e2e:
    name: Playwright E2E (Postgres) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The suite runs with workers: 1 because specs share one database. Sharding
    # gives each shard its own runner and its own Postgres service, so shards
    # never share state and the wall-clock time drops roughly by the shard count.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: burger_page_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d burger_page_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The e2e suite needs the Postgres schema + seed: same copy+apply
      # approach as the validate job (docker-entrypoint-initdb.d bind-mount
      # is racy). The seed contains the tenant/credential fixtures the
      # Playwright specs log in with against the live backend.
      - name: Apply Postgres schema and seed
        run: |
          docker cp ./database/01_schema.sql "${{ job.services.postgres.id }}":/tmp/01_schema.sql
          docker cp ./database/02_seed.sql "${{ job.services.postgres.id }}":/tmp/02_seed.sql
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d burger_page_test -v ON_ERROR_STOP=1 -1 -f /tmp/01_schema.sql
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d burger_page_test -v ON_ERROR_STOP=1 -f /tmp/02_seed.sql

      # @burger-page/contracts ships compiled JS only via its dist/ folder,
      # which is gitignored: compile it before booting the dev servers.
      - name: Build shared contracts
        run: npm --prefix packages/contracts run build

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E suite against live Postgres (shard ${{ matrix.shard }}/3)
        run: npm --prefix frontend run test:e2e -- --shard=${{ matrix.shard }}/3
        env:
          STORAGE_DRIVER: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/burger_page_test
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}-shard-${{ matrix.shard }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  migration-drift:
    name: Migration drift check (migrations vs 01_schema.sql)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      # Full history: the script needs the base branch (git show/archive of the
      # baseline and migrations as they were before this change).
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure psql client is available
        run: |
          # Production runs PostgreSQL 17: use a 17 client (PGDG) unless one is present.
          if ! command -v psql >/dev/null || [ "$(psql -V | sed -E 's/[^0-9]*([0-9]+).*/\1/')" -lt 17 ]; then
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates gnupg lsb-release
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
            echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
            echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
            export PATH="/usr/lib/postgresql/17/bin:$PATH"
          fi
          psql --version

      # Builds a database from the base branch baseline + its migrations,
      # applies the new migrations, and compares the result with a database
      # built from the current 01_schema.sql. Also runs every new migration's
      # down -> up and re-applies its up. Runs node-pg-migrate directly (no
      # doppler) against the service container.
      - name: Check migrations against 01_schema.sql
        env:
          PG_BASE_URL: postgres://postgres:postgres@localhost:5432
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] \
               && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="origin/main"
          fi
          echo "Comparing against $BASE"
          bash database/scripts/check-migration-drift.sh "$BASE"
