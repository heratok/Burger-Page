name: Build Backend Image for Azure (pull model)

# Modelo PULL: este workflow SOLO construye y publica la imagen en GHCR.
# No hace SSH ni toca la VM — un systemd timer en la VM (burgerpage-deploy.timer,
# instalado por infra/cloud-init.yaml.tftpl) hace `docker compose pull && up -d`
# cada 5 minutos y recoge esta imagen solo. No hacen falta secrets AZURE_VM_*.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'packages/contracts/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/burger-page-backend:latest
