services:
  - type: web
    name: burger-page-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm --prefix packages/contracts run build && npm --prefix backend run build
    startCommand: node backend/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
