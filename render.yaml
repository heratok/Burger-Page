services:
  - type: web
    name: burger-page-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm --prefix packages/contracts run build && npm --prefix backend run build
    startCommand: node backend/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # DATABASE_URL is managed in the Render dashboard (app_user RLS role against the
      # Supabase pooler). Never commit the value. Reference format for the dashboard:
      # postgresql://app_user.<ref>:<password>@aws-0-us-west-2.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
