# Project identification
sonar.projectKey=burger-page
sonar.projectName=Burger Page
sonar.projectVersion=1.0.0

# SonarQube server URL
sonar.host.url=http://localhost:9000

# Encoding
sonar.sourceEncoding=UTF-8

# Source folders to analyze
sonar.sources=frontend/src,backend/src,packages/contracts/src

# Test files identification
sonar.tests=frontend/src,backend/src,backend/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage report paths
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# Exclusions from main analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/test-results/**,**/playwright-report/**,database/**,supabase/**,**/coverage/**

# Multicriteria issue ignores
sonar.issue.ignore.multicriteria=seedCredentials,tailwindCssDirectives,tailwindCssScope

# 1. Ignore hardcoded credentials rule for local/test seed data fixtures
sonar.issue.ignore.multicriteria.seedCredentials.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.seedCredentials.resourceKey=backend/src/infrastructure/persistence/seedData.ts

# 2. Ignore Tailwind v4 custom at-rules and nesting false positives in index.css
sonar.issue.ignore.multicriteria.tailwindCssDirectives.ruleKey=css:S8767
sonar.issue.ignore.multicriteria.tailwindCssDirectives.resourceKey=frontend/src/index.css

sonar.issue.ignore.multicriteria.tailwindCssScope.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.tailwindCssScope.resourceKey=frontend/src/index.css
